<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miftah — Kuran Tefsir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Üst başlık -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#/home" class="brand">
        <svg class="brand-star" viewBox="0 0 40 40" aria-hidden="true"><use href="#rub-el-hizb"></use></svg>
        <span class="brand-name">Miftah</span>
      </a>

      <nav class="main-nav">
        <a href="#/home" data-nav="home">Ana Sayfa</a>
        <a href="#/sureler" data-nav="sureler">Sureler</a>
        <a href="#/kumeler" data-nav="kumeler">Kümeler</a>
        <a href="#/konular" data-nav="konular">Konular</a>

        <div class="nav-more">
          <button class="nav-more-btn" id="moreBtn" aria-haspopup="true" aria-expanded="false">
            Daha <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
          </button>
          <div class="nav-more-menu" id="moreMenu">
            <a href="#/kaynaklar/arabic">Arapça Kaynakları</a>
            <a href="#/kaynaklar/meal">Meal Kaynakları</a>
            <a href="#/kaynaklar/tefsir">Tefsir Kaynakları</a>
            <div class="menu-sep"></div>
            <a href="#/favoriler">Favorilerim</a>
            <a href="#/notlarim">Notlarım</a>
            <div class="menu-sep"></div>
            <a href="#/yedekle">Yedekle / Geri Yükle</a>
          </div>
        </div>
      </nav>

      <button class="hamburger" id="hamburgerBtn" aria-label="Menü">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="header-divider" aria-hidden="true">
      <svg width="100%" height="10" preserveAspectRatio="none"><use href="#hizb-strip"></use></svg>
    </div>
  </header>

  <!-- Mobil menü -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="#/home">Ana Sayfa</a>
    <a href="#/sureler">Sureler</a>
    <a href="#/kumeler">Kümeler</a>
    <a href="#/konular">Konular</a>
    <div class="menu-sep"></div>
    <a href="#/kaynaklar/arabic">Arapça Kaynakları</a>
    <a href="#/kaynaklar/meal">Meal Kaynakları</a>
    <a href="#/kaynaklar/tefsir">Tefsir Kaynakları</a>
    <div class="menu-sep"></div>
    <a href="#/favoriler">Favorilerim</a>
    <a href="#/notlarim">Notlarım</a>
    <a href="#/yedekle">Yedekle / Geri Yükle</a>
  </div>

  <main id="app" class="app-main"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- SVG sprite: sekiz köşeli yıldız (rub el hizb) motifi -->
  <svg style="display:none">
    <symbol id="rub-el-hizb" viewBox="0 0 40 40">
      <g fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M20 2 L26 14 L38 20 L26 26 L20 38 L14 26 L2 20 L14 14 Z"/>
        <path d="M20 8 L23.5 16.5 L32 20 L23.5 23.5 L20 32 L16.5 23.5 L8 20 L16.5 16.5 Z" opacity="0.55"/>
      </g>
    </symbol>
    <symbol id="hizb-strip" viewBox="0 0 200 10" preserveAspectRatio="none">
      <g fill="none" stroke="currentColor" stroke-width="1">
        <path d="M0 5 H200"/>
      </g>
    </symbol>
  </svg>

  <!-- Uygulama kodu: sadece 2 dosya. app.js önce, views.js sonra yüklenmeli. -->
  <script src="app.js"></script>
  <script src="views.js"></script>
</body>
</html>
